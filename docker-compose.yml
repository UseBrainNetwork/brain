# One-command local Brain network:
#   docker compose up --build
# then
#   npm run demo:request        (or: node scripts/demo-request.mjs)
#
# Services: Postgres, the coordinator/API/web app, and one mock Brain Node. The node registers
# with the coordinator over the signed protocol, heartbeats, long-polls for work, streams a mock
# answer, and the coordinator issues a signed compute receipt and accounting lines. Nothing in the
# frontend is faked: every page reads the same database the demo request wrote to.
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: brain
      POSTGRES_PASSWORD: brain
      POSTGRES_DB: brain
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U brain -d brain"]
      interval: 3s
      timeout: 3s
      retries: 20
    volumes:
      - brain-db:/var/lib/postgresql/data

  web:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://brain:brain@db:5432/brain
      # Open the /v1 API without keys for the local demo. Never set this in production.
      BRAIN_OPEN_V1: "1"
      # Stable secret so account cookies, node tickets and the receipt signer survive restarts. Change it.
      BRAIN_SERVER_SECRET: local-demo-secret-change-me
      # Leave prices unset: receipts say UNKNOWN cost rather than inventing one.
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/api/coordinator/nodes >/dev/null || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 60
      start_period: 20s

  node:
    build:
      context: .
      dockerfile: node/Dockerfile
    depends_on:
      web:
        condition: service_healthy
    environment:
      BRAIN_COORDINATOR_URL: http://web:3000
      BRAIN_NODE_MODE: mock
      BRAIN_NODE_REGION: local
    volumes:
      - brain-node:/data
    restart: unless-stopped

volumes:
  brain-db:
  brain-node:
